<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Variedade linguística e julgamento social</title><desc id="desc">Duas pessoas relatam a mesma ideia de modos diferentes, enquanto uma terceira faz um julgamento sobre quem fala. O material convida a identificar o preconceito linguístico.</desc>
<defs><linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FDFBF5"/><stop offset="1" stop-color="#EDEFF5"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1C3B8E" flood-opacity=".1"/></filter></defs>
<rect width="1280" height="720" fill="url(#back)"/><rect x="28" y="28" width="1224" height="664" rx="36" fill="none" stroke="#C9D1E2" stroke-width="2"/>
<rect x="62" y="58" width="13" height="84" rx="7" fill="#EEAF3D"/><text x="102" y="103" font-family="Arial,sans-serif" font-size="45" font-weight="800" fill="#1C3B8E">As palavras mudam. O respeito não.</text><text x="102" y="147" font-family="Arial,sans-serif" font-size="23" fill="#536078">Leia as falas e observe a reação.</text>
