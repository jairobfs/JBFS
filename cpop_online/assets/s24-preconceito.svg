<text x="161" y="264" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1C3B8E">Situação 1</text><text x="763" y="264" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#277434">Situação 2</text>
<text x="104" y="336" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#20242A">“Nós vamos amanhã.”</text><text x="705" y="336" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#20242A">“Nóis vai amanhã.”</text>
