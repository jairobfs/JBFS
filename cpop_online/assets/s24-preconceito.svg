<text x="236" y="511" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#9B2926">Reação de um colega:</text><text x="236" y="554" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#20242A">“Quem fala assim não sabe nada.”</text>
