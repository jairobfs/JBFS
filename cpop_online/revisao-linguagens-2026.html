ituadas, legítimas em seus contextos de comunicação.","estruturas que devem ser eliminadas de toda fala para preservar a língua nacional.","recursos exclusivos da poesia romântica culta.","efeitos causados unicamente pela falta de consulta a dicionários."],"img":"","alt":"Questão autoral · Acervo CPOP","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=e535f00f-87b0-1918-e669-1aa405ba5394"},{"kind":"answer","n":1,"title":"Variação e identidade","credit":"Questão autoral · Acervo CPOP","letter":"B","answer":"formas de variedades linguísticas socialmente situadas, legítimas em seus contextos de comunicação.","comment":"As variedades populares possuem regularidades linguísticas e se vinculam a práticas sociais e identidades. Dominar a norma-padrão em situações formais é importante, mas não autoriza inferiorizar falantes de outras variedades."},{"kind":"question","n":2,"title":"Podcast e registro linguístico","credit":"Questão autoral · Acervo CPOP","base":"Um podcast escolar convida agricultores de regiões diferentes a contar suas experiências. Os convidados usam expressões locais, que são preservadas na transcrição. A equipe acrescenta um glossário para leitores de outras regiões.","cmd":"O procedimento editorial evidencia que:","options":["as formas regionais são obstáculos que precisam ser eliminados antes da publicação.","é possível valorizar variedades linguísticas e ampliar a compreensão de diferentes públicos.","a variedade-padrão deve substituir integralmente a fala das pessoas entrevistadas.","uma transcrição fiel impede a explicação contextual dos termos regionais."],"alt":"Questão autoral · Acervo CPOP","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=14fe0921-e148-0e89-a249-4f20e312e7ea"},{"kind":"answer","n":2,"title":"Podcast e registro linguístico","credit":"Questão autoral · Acervo CPOP","letter":"B","answer":"é possível valorizar variedades linguísticas e ampliar a compreensão de diferentes públicos.","comment":"A manutenção dos falares reconhece identidades e usos sociais; o glossário amplia acesso sem desqualificar a variedade. Relação com H25–H26."},{"kind":"question","n":3,"title":"Línguas indígenas e patrimônio","credit":"Questão autoral · Acervo CPOP","base":"Em muitas tradições indígenas, as línguas guardam modos específicos de transmitir memória, conhecimentos ambientais, relações de parentesco e concepções de mundo. Na tradição guarani, ñe’ẽ associa a noção de palavra à dimensão da vida espiritual.","cmd":"Preservar essas línguas é fundamental porque elas:","options":["têm gramática necessariamente mais complexa que o português.","devem impedir o contato cultural com outros grupos.","transmitem cosmovisões, saberes e memórias coletivas vinculados à identidade dos falantes.","só adquirem valor quando traduzidas literalmente para a norma-padrão.","permanecem imutáveis, sem transformações históricas."],"img":"","alt":"Questão autoral · Acervo CPOP","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=9bae1b73-15e1-fde9-076e-96d1bdee371a"},{"kind":"answer","n":3,"title":"Línguas indígenas e patrimônio","credit":"Questão autoral · Acervo CPOP","letter":"C","answer":"transmitem cosmovisões, saberes e memórias coletivas vinculados à identidade dos falantes.","comment":"Uma língua é também meio de transmissão cultural e de organização de saberes. Nenhuma língua é intrinsecamente superior ou imutável, e preservar uma língua não implica isolamento de seus falantes."},{"kind":"question","n":4,"title":"Pretuguês e preconceito linguístico","credit":"Questão autoral · Acervo CPOP","base":"Lélia Gonzalez utiliza o conceito de pretuguês para problematizar o desprezo social por marcas do português brasileiro ligadas à história e à presença africana. Em seu argumento, formas populares estigmatizadas são frequentemente julgadas de maneira desigual.","cmd":"A reflexão proposta pela autora:","options":["defende abandonar toda norma-padrão no ensino formal.","denuncia o preconceito linguístico e racial, reconhecendo marcas históricas da formação do português brasileiro.","considera as formas populares erros exclusivos de pessoas com pouca escolaridade.","exige a repressão de pronúncias populares para unificar o idioma.","limita a contribuição africana a poucas palavras de comunidades isoladas."],"img":"","alt":"Questão autoral · Acervo CPOP","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=f37b191e-e6db-b628-dce7-f19b23382d1e"},{"kind":"answer","n":4,"title":"Pretuguês e preconceito linguístico","credit":"Questão autoral · Acervo CPOP","letter":"B","answer":"denuncia o preconceito linguístico e racial, reconhecendo marcas históricas da formação do português brasileiro.","comment":"O conceito de pretuguês evidencia a presença negra na formação da língua e questiona estigmas de classe e raça. Não exige abandonar a norma-padrão nem restringe variedades populares a grupos específicos."},{"kind":"question","n":5,"title":"Slam e escolha de registro","credit":"Questão autoral · Acervo CPOP","base":"Versos didáticos sobre poesia falada:\n\n“Querem que a gente leia os livros deles,\nmas, quando a gente escreve a quebrada\ncom a voz da nossa mãe, chamam de erro.\nNossa língua também concorda com a vida.”","cmd":"Nesse poema, a escolha da variedade popular busca:","options":["evidenciar incapacidade vocabular do eu lírico.","impedir deliberadamente qualquer compreensão fora do bairro.","caricaturar a fala popular apenas para gerar humor.","afirmar o falar de um grupo como instrumento de criação, identidade e resistência.","demonstrar que toda comunicação independe de padrões estruturais."],"img":"","alt":"Questão autoral · Acervo CPOP","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=c5b310aa-8b04-1fc9-07db-ea87a7e18570"},{"kind":"answer","n":5,"title":"Slam e escolha de registro","credit":"Questão autoral · Acervo CPOP","letter":"D","answer":"afirmar o falar de um grupo como instrumento de criação, identidade e resistência.","comment":"No slam e em outras expressões periféricas, escolhas linguísticas podem afirmar pertencimento e produzir crítica social. Variedades populares também possuem regularidades; o uso estético não equivale a ausência de estrutura."},{"kind":"theory","title":"Gênero, finalidade e funções","lines":["O gênero se reconhece pelo contexto, pela estrutura e pelo uso social.","Tema é o assunto. Finalidade é o que se pretende fazer. Estratégia é o recurso usado.","Funções podem coexistir. Um trocadilho salienta a forma e pode servir à persuasão."],"example":"Em uma campanha, o imperativo é um recurso. Mobilizar o público é a finalidade."},{"kind":"question","n":6,"title":"Variedade em campanha educativa","credit":"Enem 2018 · questão 06 · campanha do Ministério da Saúde","base":"","cmd":"A utilização de determinadas variedades linguísticas em campanhas educativas tem a função de atingir o público-alvo de forma mais direta e eficaz. No caso desse texto, identifica-se essa estratégia pelo(a)","options":["discurso formal da língua portuguesa.","registro padrão próprio da língua escrita.","seleção lexical restrita à esfera da medicina.","fidelidade ao jargão da linguagem publicitária.","uso de marcas linguísticas típicas da oralidade."],"img":"canon-vest-02.jpg","alt":"ENEM 2018 · campanha educativa do Ministério da Saúde","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=132ba2ec-160d-65ea-4723-d3078105cbb5"},{"kind":"answer","n":6,"title":"Variedade em campanha educativa","credit":"Enem 2018 · questão 06 · campanha do Ministério da Saúde","letter":"E","answer":"uso de marcas linguísticas típicas da oralidade.","comment":"Construções conversacionais e léxico cotidiano aproximam a campanha de seu público-alvo; não se trata de jargão médico nem de registro formal."},{"kind":"question","n":7,"title":"Finalidade de um cartaz","credit":"Acervo CPOP · modelo de campanha do agasalho · recorte","base":"","cmd":"Qual a finalidade do texto?","options":["Informar sobre os tipos de roupas adequadas para o inverno.","Anunciar a venda de agasalhos para a estação mais fria do ano.","Contar a história de uma campanha de doações de roupas de inverno.","Ensinar como organizar campanhas solidárias em instituições públicas.","Divulgar uma campanha de arrecadação de agasalhos e convidar a população a participar."],"img":"canon-q260.jpg","alt":"Cartaz de campanha do agasalho em fundo rosa, com ilustrações de peças de roupa, datas e locais de coleta.","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=0810e239-8fd8-427a-fe74-9d6bcfb9f7bb"},{"kind":"answer","n":7,"title":"Finalidade de um cartaz","credit":"Acervo CPOP · modelo de campanha do agasalho · recorte","letter":"E","answer":"Divulgar uma campanha de arrecadação de agasalhos e convidar a população a participar.","comment":"O imperativo do cartaz convoca o leitor a ajudar. O nome da campanha, as ilustrações de roupas e as datas delimitam a ação proposta: participar de uma campanha de doação de agasalhos."},{"kind":"question","n":8,"title":"Poesia e metalinguagem","credit":"Questão autoral · Acervo CPOP","base":"Texto de apoio (manifesto poético didático):\n\n“A poesia não se explica: habita-se. Escrever é rasgar o silêncio com palavras.”","cmd":"Ao falar sobre a própria poesia e sobre o ato de escrever, o trecho evidencia predominantemente a função:","options":["fática, por testar o canal da comunicação.","conativa, por tentar vender um produto ao leitor.","referencial, por apresentar dados verificáveis sobre o mercado editorial.","metalinguística, por usar a linguagem para refletir sobre o fazer literário.","emotiva, por narrar um acontecimento pessoal específico."],"img":"","alt":"Questão autoral · Acervo CPOP","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=9820d7d9-4381-018e-07ef-6f224d6e1098"},{"kind":"answer","n":8,"title":"Poesia e metalinguagem","credit":"Questão autoral · Acervo CPOP","letter":"D","answer":"metalinguística, por usar a linguagem para refletir sobre o fazer literário.","comment":"O código volta-se sobre si mesmo: as imagens procuram definir o fazer poético. Há recursos da função poética, mas o assunto central é o próprio ato de criar com a linguagem."},{"kind":"question","n":9,"title":"Registro em mensagem digital","credit":"Acervo CPOP · Saeb II/15 · conversa digital","base":"","cmd":"Nesse texto predomina a linguagem do meio digital, pois","options":["os interlocutores utilizam termos científicos e formais para justificar suas decisões.","a mensagem apresenta linguagem rebuscada e normas gramaticais rigorosas.","há o uso de abreviações, expressões informais e recursos típicos da comunicação em aplicativos de mensagens.","os participantes utilizam linguagem técnica e objetiva, típica de ambientes acadêmicos.","as frases estão organizadas em parágrafos curtos e estruturados, visando a formalidade da comunicação."],"img":"canon-q265.jpg","alt":"Conversa em aplicativo: E ai mano, vamos sair?; foi mal cara, nem vai dar ):; porque??; pq eu não quero.","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=788ee786-116c-609d-2b63-15c2918ab330"},{"kind":"answer","n":9,"title":"Registro em mensagem digital","credit":"Acervo CPOP · Saeb II/15 · conversa digital","letter":"C","answer":"há o uso de abreviações, expressões informais e recursos típicos da comunicação em aplicativos de mensagens.","comment":"Evidência: abreviações como “pq”, perguntas com pontuação expressiva e marcas de conversa cotidiana. Mecanismo: o gênero digital favorece formas econômicas e informais de interação. Limite: informalidade contextual não equivale à incapacidade linguística dos participantes."},{"kind":"theory","title":"Palavra, imagem e argumentação","lines":["Palavra e imagem podem se reforçar, completar informações ou criar contraste.","Identifique a reação buscada e o detalhe verbal ou visual que a sustenta.","Compare dois sentidos possíveis quando imagem e palavra explorarem ambiguidade."],"example":"Se retirar a imagem mudar a leitura da frase, ela participa do argumento."},{"kind":"question","n":10,"title":"Humor na tirinha","credit":"Acervo CPOP · Saeb II/01 · Adão Iturrusgarai","base":"","cmd":"O humor da tirinha está","options":["na surpresa da personagem que descobre que passou muito mais tempo longe do celular do que imaginava.","na contradição entre o que o personagem afirma e o que ele revela em seguida sobre o tempo real longe do celular.","no fato de os personagens usarem linguagem formal demais para uma situação cotidiana.","no momento em que a personagem se esquece completamente do que é um celular.","em mostrar personagens que vivem em um mundo sem tecnologia."],"img":"canon-q251.jpg","alt":"Tirinha de quatro quadros; personagens conversam sobre tempo sem usar o celular.","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=652bde89-270f-7f51-2273-c1e015666496"},{"kind":"answer","n":10,"title":"Humor na tirinha","credit":"Acervo CPOP · Saeb II/01 · Adão Iturrusgarai","letter":"B","answer":"na contradição entre o que o personagem afirma e o que ele revela em seguida sobre o tempo real longe do celular.","comment":"A personagem informa primeiro que ficou dois dias sem celular. Depois, especifica sete horas, 25 minutos e 32 segundos. A precisão do intervalo e a contradição com a primeira fala produzem o humor."},{"kind":"question","n":11,"title":"Ambiguidade no outdoor","credit":"Acervo CPOP · Saeb II/14 · outdoor","base":"","cmd":"Essa mensagem utiliza um jogo de palavras para reforçar o sentido do texto. O efeito de sentido produzido pela escolha da palavra “privada”, ao invés de simplesmente “particular”, está relacionado","options":["ao reforço da ideia de que os banheiros devem ser públicos e não individuais.","à tentativa de formalizar a linguagem, substituindo gírias por termos técnicos.","à crítica direta ao uso das ruas por veículos particulares em horários de pico.","ao duplo sentido da palavra, que faz referência tanto ao que é privado quanto ao objeto privada, criando um tom irônico.","à valorização da privacidade dos moradores locais, que não deve ser invadida pelo lixo urbano, chamando a atenção contra o descarte do lixo."],"img":"canon-q264.jpg","alt":"Outdoor urbano com a frase A RUA É PÚBLICA, NÃO É PRIVADA e ilustração de um vaso sanitário.","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=a7eff78e-e292-cf07-7917-fb47233a0da5"},{"kind":"answer","n":11,"title":"Ambiguidade no outdoor","credit":"Acervo CPOP · Saeb II/14 · outdoor","letter":"D","answer":"ao duplo sentido da palavra, que faz referência tanto ao que é privado quanto ao objeto privada, criando um tom irônico.","comment":"Evidência: a oposição “pública/privada” e o desenho de um vaso sanitário. Mecanismo: a palavra “privada” associa o sentido de espaço particular ao objeto representado, criando um jogo semântico com finalidade crítica. Armadilha: a frase não se reduz à defesa da propriedade privada ou à crítica ao trânsito."},{"kind":"question","n":12,"title":"O recurso sintático na charge","credit":"Enem 2013 · questão 119 · charge via Clube da Mafalda","base":"","cmd":"Nessa charge, o recurso morfossintático que colabora para o efeito de humor está indicado pelo(a)","options":["emprego de uma oração adversativa, que orienta a quebra da expectativa ao final.","uso de conjunção aditiva, que cria uma relação de causa e efeito entre as ações.","retomada do substantivo “mãe”, que desfaz a ambiguidade dos sentidos a ele atribuídos.","utilização da forma pronominal “la”, que reflete um tratamento formal do filho em relação à “mãe”.","repetição da forma verbal “é”, que reforça a relação de adição existente entre as orações."],"img":"canon-vest-01.png","alt":"ENEM 2013 · questão 119 · charge","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=e91bbce1-a029-586d-6f7b-ac5934a447fc"},{"kind":"answer","n":12,"title":"O recurso sintático na charge","credit":"Enem 2013 · questão 119 · charge via Clube da Mafalda","letter":"A","answer":"emprego de uma oração adversativa, que orienta a quebra da expectativa ao final.","comment":"A conjunção mas quebra a expectativa criada pelo provérbio “a preguiça é a mãe de todos os vícios”: o segundo movimento passa do valor negativo de “mãe = origem” ao valor literal/afetivo de maternidade, produzindo o humor.\n\nArmadilha. A retomada de “mãe” participa do jogo semântico, mas o recurso morfossintático que organiza a virada é a adversativa."},{"kind":"question","n":13,"title":"Paródia em uma tirinha","credit":"Unicamp 2017 · tirinha","base":"","cmd":"Na tira, o autor retoma o lema “Operários do mundo, uni-vos!”. Considerando os sentidos produzidos pela tirinha, é correto afirmar que nela se lê","options":["uma apologia ao Manifesto Comunista, atenuada pela onomatopeia das abelhas.","uma paródia do lema, baseada na semelhança fonética entre “uni-vos” e “zuni-vos”.","uma parábola para explicar o Manifesto Comunista.","uma fábula que recria o lema com base na linguagem onomatopaica das abelhas."],"img":"canon-vest-06.jpg","alt":"UNICAMP 2017 · tirinha","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=212970d6-4eed-d254-9d0f-d724146d2f36"},{"kind":"answer","n":13,"title":"Paródia em uma tirinha","credit":"Unicamp 2017 · tirinha","letter":"B","answer":"uma paródia do lema, baseada na semelhança fonética entre “uni-vos” e “zuni-vos”.","comment":"Evidência → mecanismo. O lema uni-vos é recriado com o efeito fônico zuni-vos, associado ao zumbido das abelhas. A retomada transforma o texto-fonte com finalidade cômica; não é apologia, parábola ou fábula."},{"kind":"question","n":14,"title":"Expressão idiomática e imagem","credit":"Fuvest 2019 · Q57 · Adão Iturrusgarai","base":"","cmd":"O efeito de humor que se obtém no cartum decorre, principalmente,","options":["da expressão facial da personagem.","do uso de uma ferramenta fora de contexto.","da situação rotineira exposta pela imagem.","da ambiguidade presente na expressão “quebre a cara”.","do emprego de linguagem popular."],"img":"canon-vest-03.jpg","alt":"FUVEST 2019 · cartum de Adão Iturrusgarai","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=613f1be2-df50-a528-a37f-3d91a3df4961"},{"kind":"answer","n":14,"title":"Expressão idiomática e imagem","credit":"Fuvest 2019 · Q57 · Adão Iturrusgarai","letter":"D","answer":"da ambiguidade presente na expressão “quebre a cara”.","comment":"A expressão admite leitura idiomática e leitura literal compatível com a imagem, e o choque entre as duas sustenta o humor."},{"kind":"theory","title":"Inferência, pressuposição e humor","lines":["Inferência é uma conclusão apoiada por pistas do texto.","Pressuposição é uma informação tratada como dada, muitas vezes acionada por um termo.","Na ironia, a leitura literal entra em choque com o contexto."],"example":"“Voltou a abrir” pressupõe que já abriu antes."},{"kind":"theory","title":"Coesão e efeito de sentido","lines":["Pronomes, repetições e substituições retomam referentes.","Conectores expressam relações como contraste, causa, concessão ou conclusão.","Progressão temática acontece quando uma retomada acrescenta informação."],"example":"Em “Embora chovesse, a feira abriu”, a chuva não impede a abertura."},{"kind":"question","n":15,"title":"O valor de “voltou”","credit":"Questão autoral · Acervo CPOP","base":"Em uma mensagem, lê-se: “Depois de um intervalo, Helena voltou a estudar para o exame.”","cmd":"Qual informação é pressuposta pelo verbo voltou?","options":["Helena certamente será aprovada no exame.","Helena nunca havia estudado antes desse momento.","Helena já tinha estudado anteriormente e retomou a atividade.","Helena pretende abandonar os estudos em definitivo."],"alt":"Questão autoral · Acervo CPOP","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=b2244c41-b84a-ecf6-1758-8a67123d0e51"},{"kind":"answer","n":15,"title":"O valor de “voltou”","credit":"Questão autoral · Acervo CPOP","letter":"C","answer":"Helena já tinha estudado anteriormente e retomou a atividade.","comment":"O verbo aspectual “voltar a” marca retomada de uma atividade anterior, sustentando a pressuposição de que Helena já estudara antes. Não autoriza conclusões sobre aprovação."},{"kind":"question","n":16,"title":"A relação introduzida por “embora”","credit":"Questão autoral · Acervo CPOP","base":"“Embora os indicadores econômicos apontassem crescimento, a distribuição de renda permaneceu desigual.”","cmd":"No período, a conjunção “embora” introduz uma relação de:","options":["causa, explicitando a razão da desigualdade.","consequência direta do crescimento econômico.","concessão, apresentando circunstância que contrasta com a permanência da desigualdade.","proporção, indicando aumento simultâneo de duas variáveis.","comparação, estabelecendo semelhança entre indicadores."],"img":"","alt":"Questão autoral · Acervo CPOP","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=12cc3948-f6dc-94fe-925a-5ba081a7035d"},{"kind":"answer","n":16,"title":"A relação introduzida por “embora”","credit":"Questão autoral · Acervo CPOP","letter":"C","answer":"concessão, apresentando circunstância que contrasta com a permanência da desigualdade.","comment":"O crescimento econômico poderia gerar uma expectativa de melhora distributiva, mas não impede a desigualdade. “Embora” introduz uma concessão, e não causa ou consequência."},{"kind":"theory","title":"Literatura e ponto de vista","lines":["Autor, narrador, personagem e eu lírico ocupam posições distintas.","Observe quem fala, quem decide e quais experiências ganham espaço.","Repetição, hipérbole e enumeração fazem sentido no contexto do fragmento."],"example":"Um relógio pode medir o tempo da cena e também expressar a angústia de quem narra."},{"kind":"theory","title":"Arte, suporte e contexto","lines":["Identifique o material, a técnica e a forma de apresentação.","Mostre como a escolha visual dá corpo à interpretação.","Compare o texto curatorial com aquilo que a obra efetivamente mostra."],"example":"Um objeto comum pode adquirir outra função quando integrado a uma instalação."},{"kind":"question","n":17,"title":"Inferência no poema","credit":"Acervo CPOP · Saeb II/05 · Derek Walcott","base":"O AMOR DEPOIS DO AMOR · Derek Walcott\n\nUm dia virá\nem que, eufórico,\nvocê cumprimentará a si próprio chegando\nà sua porta, em seu espelho\ne cada um dará ao outro um sorriso de boas-vindas,\ne você dirá, sente-se aqui. Coma.\nVocê amará outra vez o estranho que foi.\nSirva vinho. Reparta o pão. Restitua\no seu coração para ele mesmo,\npara o estranho que um dia você amou\npor toda sua vida, a quem você ignorou\npor outro, que o conhece de cor.\nDerrube da estante as cartas de amor,\nas fotografias, os bilhetes desesperados,\narranque sua imagem do espelho.\nSente-se. Saboreie a sua vida.","cmd":"De acordo com o poema, é possível inferir que o","options":["eu lírico espera por uma visita importante.","poema sugere um jantar romântico com outra pessoa.","texto sugere a importância da reconciliação consigo mesmo.","eu lírico narra uma rotina comum de uma refeição solitária.","poema trata do reencontro com alguém que retornou de uma longa viagem."],"alt":"Acervo CPOP · Saeb II/05 · Derek Walcott","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=c196be3a-f698-e0d0-a135-d1192a5050bc"},{"kind":"answer","n":17,"title":"Inferência no poema","credit":"Acervo CPOP · Saeb II/05 · Derek Walcott","letter":"C","answer":"texto sugere a importância da reconciliação consigo mesmo.","comment":"Evidência: o espelho, a saudação a si próprio e o convite para recuperar o próprio coração. Mecanismo: as imagens de encontro e acolhimento representam reconciliação consigo mesmo. Limite: a mesa e o vinho não autorizam concluir que haverá uma visita romântica literal."},{"kind":"question","n":18,"title":"O trabalho de escrever","credit":"Enem 2003 · Moacyr Scliar, O escritor e seus desafios","base":"Do pedacinho de papel ao livro impresso vai uma longa distância. Mas o que o escritor quer, mesmo, é isso: ver o seu texto em letra de forma. A gaveta é ótima para aplacar a fúria criativa; ela faz amadurecer o texto da mesma forma que a adega faz amadurecer o vinho. Em certos casos, a cesta de papel é melhor ainda.\n\nO período de maturação na gaveta é necessário, mas não deve se prolongar muito. “Textos guardados acabam cheirando mal”, disse Silvia Plath, (...) que, com esta frase, deu testemunho das dúvidas que atormentam o escritor: publicar ou não publicar? guardar ou jogar fora?\n\nMoacyr Scliar. O escritor e seus desafios.","cmd":"Nesse texto, o escritor Moacyr Scliar usa imagens para refletir sobre uma etapa da criação literária. A ideia de que o processo de maturação do texto nem sempre é o que garante bons resultados está sugerida na seguinte frase:","options":["“A gaveta é ótima para aplacar a fúria criativa”.","“Em certos casos, a cesta de papel é melhor ainda”.","“O período de maturação na gaveta é necessário, (...)”.","“Mas o que o escritor quer, mesmo, é isso: ver o seu texto em letra de forma”.","“ela (a gaveta) faz amadurecer o texto da mesma forma que a adega faz amadurecer o vinho”."],"alt":"Enem 2003 · Moacyr Scliar, O escritor e seus desafios","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=4c9ba5f8-1f3d-8780-2833-e81c6e2f96ff"},{"kind":"answer","n":18,"title":"O trabalho de escrever","credit":"Enem 2003 · Moacyr Scliar, O escritor e seus desafios","letter":"B","answer":"“Em certos casos, a cesta de papel é melhor ainda”.","comment":"O texto associa a gaveta ao amadurecimento, mas introduz a “cesta de papel” como limite desse processo. A imagem do descarte mostra que tempo de maturação não garante qualidade: um texto pode exigir abandono e recomeço.\n\nArmadilha. A, C e E reiteram a maturação como valor positivo; D focaliza o desejo de publicação. Nenhuma delas explicita o limite do processo tão diretamente quanto B."},{"kind":"question","n":19,"title":"O tempo em O espelho","credit":"Unicamp 2020 · 1ª fase · Q60 · Machado de Assis","base":"No conto O espelho, de Machado de Assis, Jacobina narra a solidão na casa da tia Marcolina: “As horas batiam de século a século no velho relógio da sala, cuja pêndula, tic-tac, tic-tac, feria-me a alma interior como um piparote contínuo da eternidade.”","cmd":"Considerando os indicadores da passagem do tempo na citação, é correto afirmar que:","options":["o movimento oscilante do pêndulo do relógio expressa a duplicidade da alma interior.","o som do velho relógio da sala materializa acusticamente a longevidade da alma interior.","a sonoridade repetitiva do pêndulo intensifica as aflições da alma interior.","o contínuo batimento das horas sugere o vigor da alma interior."],"alt":"Unicamp 2020 · 1ª fase · Q60 · Machado de Assis","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=d6723c48-87f4-8f12-9106-52d0ee47af04"},{"kind":"answer","n":19,"title":"O tempo em O espelho","credit":"Unicamp 2020 · 1ª fase · Q60 · Machado de Assis","letter":"C","answer":"a sonoridade repetitiva do pêndulo intensifica as aflições da alma interior.","comment":"A repetição “tic-tac, tic-tac” e a percepção hiperbólica de que as horas batiam “de século a século” convertem o tempo em experiência angustiante e intensificam as aflições da alma interior de Jacobina.\nDistratores · A desloca indevidamente a dualidade das almas para o pêndulo; B confunde duração subjetiva com longevidade; D supõe vigor justamente quando a alma interior está fragilizada."},{"kind":"question","n":20,"title":"Instalação e crítica social","credit":"Questão autoral · Acervo CPOP","base":"Situação hipotética de análise visual: uma instalação em praça pública apresenta sapatos infantis vazios, acompanhados de informações sobre trabalho infantil e evasão escolar.","cmd":"A estratégia compositiva procura principalmente:","options":["valorizar uma beleza puramente ornamental, alheia a conflitos sociais.","recriar fielmente paisagens rurais históricas.","ressignificar objetos cotidianos para provocar estranhamento e reflexão crítica.","promover a venda comercial de esculturas utilitárias.","reproduzir técnicas acadêmicas tradicionais de pintura a óleo."],"img":"","alt":"Questão autoral · Acervo CPOP","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=11e8d061-9067-e413-d520-e84d040c103a"},{"kind":"answer","n":20,"title":"Instalação e crítica social","credit":"Questão autoral · Acervo CPOP","letter":"C","answer":"ressignificar objetos cotidianos para provocar estranhamento e reflexão crítica.","comment":"A apropriação de objetos comuns, no contexto de uma instalação, constrói uma mensagem de denúncia social. O texto descreve uma situação pedagógica hipotética, não uma obra real identificada."},{"kind":"question","n":21,"title":"O cenário de uma confissão","credit":"Unicamp 2020 · 1ª fase · Q62 · Nelson Rodrigues","base":"“Há coisas que um grã-fino só confessa num terreno baldio, à luz de archotes, e na presença apenas de uma cabra vadia.”\n\n“Não podia ser um gabinete, nem uma sala. Lembrei-me, então, do terreno baldio. Eu e o entrevistado e, no máximo, uma cabra vadia. Além do valor plástico da figura, a cabra não trai. Realmente, nunca se viu uma cabra sair por aí fazendo inconfidências.”","cmd":"O caráter confessional associado à figura da cabra nas crônicas tem relação com:","options":["a veracidade dos depoimentos que o cronista testemunha nas entrevistas.","a impostura dos contemporâneos que são objeto dos comentários do cronista.","a antipatia do jornalista no que diz respeito à busca de identidade dos artistas entrevistados.","a sinceridade dos intelectuais que são objeto das crônicas dos jornalistas."],"alt":"Unicamp 2020 · 1ª fase · Q62 · Nelson Rodrigues","src":"craftdocs://open?spaceId=28cd93e6-2faa-c967-1053-8a766a45d839&blockId=d66cb607-f1e6-4dd6-7b1a-63f6aeaa8a45"},{"kind":"answer","n":21,"title":"O cenário de uma confissão","credit":"Unicamp 2020 · 1ª fase · Q62 · Nelson Rodrigues","letter":"B","answer":"a impostura dos contemporâneos que são objeto dos comentários do cronista.","comment":"Evidência decisiva. a cabra não trai / nunca se viu uma cabra ... fazendo inconfidências: o cenário imaginário suspende a sociabilidade pública e permite ao cronista satirizar máscaras e hipocrisias.\n\nMecanismo. O caráter confessional não decorre de entrevistas factualmente verdadeiras, mas da ficção de um espaço em que o entrevistado poderia abandonar a afetação pública."},{"kind":"theory","title":"Práticas corporais, mídia e tecnologia","lines":["Inclusão esportiva envolve condições concretas de acesso e participação.","Uma cobertura escolhe o que exibir e pode deixar o trabalho esportivo fora de quadro.","Uma nova tecnologia pode coexistir com meios e práticas anteriores."],"example":"Uma competição na TV e uma política de acesso ao esporte respondem a problemas diferentes."},{"kind":"theory","title":"Inglês e espanhol","lines":["Leia o comando, localize o gênero e identifique a passagem decisiva.","Preste atenção a negações, retomadas e conectores de contraste.","Relacione imagem e texto quando os dois modos fizerem parte do item."],"example":"Resolva as questões na língua escolhida na inscrição."}]</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('conteudo').textContent);
const slide=document.getElementById('slide'), select=document.getElementById('ir');
const next=document.getElementById('avancar'),prev=document.getElementById('voltar'), progress=document.getElementById('progresso'), expand=document.getElementById('expandir');
const labels={cover:'Abertura',agenda:'Roteiro de 60 minutos',theory:'Exposição teórica',question:'Questão',answer:'Correção'};
const number=n=>String(n).padStart(2,'0');
const el=(tag,txt,cls)=>{const n=document.createElement(tag);if(txt)n.textContent=txt;if(cls)n.className=cls;return n;};
function makeQuestion(container,s){
  if(s.img||s.base){
    const source=el('div',null,'source');
    if(s.img){
      const fig=el('figure'), image=el('img');
      image.src='/assets/canon/'+s.img;image.alt=s.alt;
      const crop={'canon-vest-01.png':'crop-charge','canon-q260.jpg':'crop-cartaz'}[s.img];
      if(crop){const holder=el('div',null,crop);holder.append(image);fig.append(holder);}
      else fig.append(image);
      fig.append(el('figcaption',s.credit));source.append(fig);
    }else source.textContent=s.base;
    container.append(source);container.classList.add('split');
  }
  const right=el('div');
  right.append(el('p',s.cmd,'command'));
  const opts=el('ol',null,'options');
  s.options.forEach((op,i)=>{const line=el('li');line.append(el('b',String.fromCharCode(65+i)),el('span',op));opts.append(line);});
  right.append(opts);container.append(right);
}
function render(index,focus=false){
  const s=data[index];
  document.body.classList.toggle('reveal',s.kind==='answer'||s.kind==='cover');
  slide.className='slide '+s.kind;
  const kicker=s.n?labels[s.kind]+' '+number(s.n)+' · '+s.credit:labels[s.kind];
  slide.replaceChildren(el('p',kicker,'kicker'),el('h1',s.title));
  const content=el('div',null,'content');
  if(s.kind==='cover')content.append(el('p',s.description),el('p',s.detail));
  if(s.kind==='agenda'){
    const list=el('ul',null,'plan');
    s.rows.forEach(([time,title,body])=>{const li=el('li');li.append(el('b',time+' · '+title),el('div',body));list.append(li);});
    content.append(list);
  }
  if(s.kind==='theory'){
    const list=el('ol');
    s.lines.forEach(line=>list.append(el('li',line)));
    content.append(list,el('p',s.example,'example'));
  }
  if(s.kind==='question')makeQuestion(content,s);
  if(s.kind==='answer'){
    const correct=el('p');
    correct.append(el('b',s.letter,'letter'),el('strong',s.answer));
    content.append(correct,el('p',s.comment));
  }
  slide.append(content);
  select.value=index;
  progress.textContent=(index+1)+' / '+data.length;
  prev.disabled=index===0;next.disabled=index===data.length-1;
  next.textContent=s.kind==='question'?'Revelar gabarito':'Avançar';
  if(focus){window.scrollTo(0,0);slide.focus({preventScroll:true});}
}
let position=0;
function move(n){
 const target=Math.max(0,Math.min(data.length-1,n));
 if(target===position)return;
 position=target;
 history.replaceState(null,'','#etapa-'+(position+1));
 render(position,true);
}
data.forEach((s,i)=>{const op=el('option',number(i+1)+' · '+labels[s.kind]+' · '+s.title);op.value=i;select.append(op);});
select.addEventListener('change',()=>move(Number(select.value)));
prev.addEventListener('click',()=>move(position-1));next.addEventListener('click',()=>move(position+1));
document.addEventListener('keydown',e=>{
 if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;
 if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(position+1);}
 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(position-1);}
 if(e.key==='Home'){e.preventDefault();move(0);} if(e.key==='End'){e.preventDefault();move(data.length-1);}
});
if(!document.fullscreenEnabled)expand.hidden=true;
expand.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{expand.hidden=true;}});
document.addEventListener('fullscreenchange',()=>{expand.textContent=document.fullscreenElement?'Sair da tela cheia':'Tela cheia';});
const hash=/^#etapa-(\d+)$/.exec(location.hash);
