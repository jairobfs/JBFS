<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="ttl desc">
<title id="ttl">Bloqueio atrioventricular de segundo grau, Mobitz I, fenômeno de Wenckebach</title>
<desc id="desc">Traçado vetorial esquemático: cinco ondas P igualmente espaçadas, PR crescente de 180, 280 e 340 milissegundos, quarta P não conduzida e reinício do PR em 180 milissegundos no quinto ciclo.</desc>
<defs>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112A44"/><stop offset=".52" stop-color="#0C2035"/><stop offset="1" stop-color="#0A182C"/></linearGradient>
 <linearGradient id="strokeGlow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#A5FFFF"/><stop offset="1" stop-color="#38CDD9"/></linearGradient>
 <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#152E49" stop-opacity=".95"/><stop offset="1" stop-color="#152E49" stop-opacity=".45"/></linearGradient>
 <pattern id="minor" width="10.4" height="10.4" patternUnits="userSpaceOnUse"><path d="M10.4 0H0V10.4" fill="none" stroke="#60A9BB" stroke-width=".6" opacity=".22"/></pattern>
 <pattern id="major" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#78ADBF" stroke-width="1.1" opacity=".34"/></pattern>
 <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feGaussianBlur in="SourceAlpha" stdDeviation="13" result="blur"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="neon" x="-12%" y="-80%" width="124%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
 <clipPath id="chartClip"><rect x="110" y="316" width="1290" height="242" rx="12"/></clipPath>
</defs>
